# 共用設定：登入 Harbor、使用有 Docker 的 runner
# 子類別要設定 SERVICE_NAME：同時是「資料夾名稱」和「image 名稱」（例如 server、frontend）
# 每個服務資料夾裡都要有自己的 Dockerfile
# 一個資料夾要出多個 image 時（例如 scheduler 的 Api／Job），另外設定：
#   IMAGE_NAME：image 名稱（預設同 SERVICE_NAME）
#   DOCKERFILE：Dockerfile 路徑（預設 $SERVICE_NAME/Dockerfile），build context 仍是 $SERVICE_NAME
.harbor:
  image: ${HARBOR_URL}/base_image/docker:28-dind
  tags:
    - k8s-runners
  variables:
    IMAGE_PATH: mo-agentchat # Harbor 專案底下的資料夾（只能小寫）
  before_script:
    # 檢查必要的 GitLab CI/CD Variables 有沒有設定（密碼只顯示是否有值，不印出內容）
    - |
      for v in HARBOR_URL HARBOR_PROJECT HARBOR_USER HARBOR_PASSWORD SERVICE_NAME; do
        eval val=\$$v
        if [ -z "$val" ]; then echo "❌ $v 沒有設定"; MISSING=1; fi
      done
      echo "HARBOR_URL=$HARBOR_URL HARBOR_PROJECT=$HARBOR_PROJECT HARBOR_USER=$HARBOR_USER"
      [ -z "$MISSING" ] || exit 1
    - echo "${HARBOR_PASSWORD}" | docker login -u "${HARBOR_USER}" --password-stdin "${HARBOR_URL}"
    - IMAGE_NAME=${IMAGE_NAME:-$SERVICE_NAME}
    - DOCKERFILE=${DOCKERFILE:-$SERVICE_NAME/Dockerfile}
    - REPO=${HARBOR_URL}/${HARBOR_PROJECT}/${IMAGE_PATH}/${IMAGE_NAME} # 完整名稱是 $REPO-<環境>
    # 原始碼指紋：服務資料夾內容相同就相同，用來找出「QAS 測過的就是這份程式碼」的 image
    # -print0／-0：檔名可能含空格（例如 server/testdata 的 Excel）
    - SRC_ID=src-$(find $SERVICE_NAME -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)

# 父類別：build image 並推到 Harbor（QAS 用）
# 子類別設定 DEPLOY_ENV（環境）、DEPLOY_BRANCH（觸發分支）、SERVICE_NAME，
# 以及 rules（只有改到該服務的資料夾才跑，見 qas.yaml）
.build-image:
  extends: .harbor
  stage: release
  script:
    - BUILD_ID=`TZ=UTC-8 date +%Y%m%d%H%M`-${CI_COMMIT_SHORT_SHA} # 台灣時間＋commit，例如 202610151430-a1b2c3d
    - IMAGE=$REPO-$DEPLOY_ENV
    - docker build -f ./$DOCKERFILE --build-arg BUILD_ID=$BUILD_ID -t $IMAGE:$BUILD_ID -t $IMAGE:$SRC_ID ./$SERVICE_NAME
    - docker push $IMAGE:$BUILD_ID
    - docker push $IMAGE:$SRC_ID
    - echo "✅ 已推送到 Harbor：$IMAGE:$BUILD_ID"

# 父類別：不重新 build，把 SOURCE_ENV 測過的 image 推廣到 DEPLOY_ENV（PRD 用）
# 確保上線的 image 和 QAS 驗收的是同一個（digest 相同）
# 子類別一樣要設定 SERVICE_NAME 和 rules（見 prd.yaml）
.promote-image:
  extends: .harbor
  stage: release
  variables:
    SOURCE_ENV: qas
  script:
    - SRC=$REPO-$SOURCE_ENV:$SRC_ID
    - docker pull $SRC || { echo "❌ $SOURCE_ENV 找不到這份程式碼的 image（$SRC_ID），請先 merge 到 $SOURCE_ENV 並等 build 完成"; exit 1; }
    - BUILD_ID=$(docker inspect -f '{{index .Config.Labels "build-id"}}' $SRC) # 沿用 QAS build 時的編號
    - IMAGE=$REPO-$DEPLOY_ENV
    - docker tag $SRC $IMAGE:$BUILD_ID
    - docker tag $SRC $IMAGE:$SRC_ID
    - docker push $IMAGE:$BUILD_ID
    - docker push $IMAGE:$SRC_ID
    - echo "✅ 已將 $SOURCE_ENV 的 image 推廣到 Harbor：$IMAGE:$BUILD_ID"

# 父類別：打 git tag（例如 v1.0.0）時，在 DEPLOY_ENV 的 image 加上版本號
.tag-version:
  extends: .harbor
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - SRC=$REPO-$DEPLOY_ENV:$SRC_ID
    - docker pull $SRC || { echo "❌ $DEPLOY_ENV 找不到這份程式碼的 image（$SRC_ID），請在已上線的 $DEPLOY_BRANCH commit 上打 tag"; exit 1; }
    - docker tag $SRC $REPO-$DEPLOY_ENV:$CI_COMMIT_TAG
    - docker push $REPO-$DEPLOY_ENV:$CI_COMMIT_TAG
    - echo "✅ 已加上版本號：$REPO-$DEPLOY_ENV:$CI_COMMIT_TAG"
