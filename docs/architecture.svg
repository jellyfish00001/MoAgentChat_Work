    <rect x="1211" y="114" width="58" height="22" rx="11" fill="#FEF9C3"/><text x="1240" y="129" fill="#854D0E">QAS</text>
    <rect x="1275" y="114" width="58" height="22" rx="11" fill="#FEE2E2"/><text x="1304" y="129" fill="#991B1B">PRD</text>
  </g>

