  <rect x="100" y="355" width="160" height="80" rx="10" fill="#EEF2FF" stroke="#0F1689" stroke-width="2"/>
  <text x="180" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#0F1689">CD Repo</text>
  <text x="180" y="412" text-anchor="middle" font-size="11" fill="#6B7280">Helm Chart · values.yaml</text>
  <line x1="262" y1="395" x2="336" y2="395" stroke="#374151" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="299" y="385" text-anchor="middle" font-size="11" fill="#374151">clone/push</text>

