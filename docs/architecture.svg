  <!-- Vault -->
  <line x1="1115" y1="422" x2="1115" y2="556" stroke="#374151" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="1122" y="488" font-size="11" fill="#374151">Retrieve Secrets</text>
  <text x="1122" y="503" font-size="10" fill="#6B7280">API Key / DB URL</text>
  <rect x="1060" y="560" width="110" height="80" rx="10" fill="#F9FAFB" stroke="#111827" stroke-width="2"/>
