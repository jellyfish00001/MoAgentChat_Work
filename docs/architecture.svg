  <text x="1150" y="175" font-size="11" fill="#92400E">AAD 認證 · pod 權限</text>

  <rect x="1080" y="190" width="320" height="58" rx="8" fill="#FAF5FF" stroke="#9333EA" stroke-width="1.5" stroke-dasharray="6 4"/>
