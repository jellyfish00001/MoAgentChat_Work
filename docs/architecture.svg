  <text x="1115" y="614" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Vault</text>

  <!-- PostgreSQL -->
  <line x1="1245" y1="422" x2="1245" y2="556" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1252" y="530" font-size="11" fill="#374151">connect</text>
  <rect x="1190" y="560" width="110" height="80" rx="10" fill="#EFF6FF" stroke="#336791" stroke-width="2"/>
  <text x="1245" y="595" text-anchor="middle" font-size="14" font-weight="700" fill="#336791">PostgreSQL</text>
  <text x="1245" y="615" text-anchor="middle" font-size="11" fill="#6B7280">WCP 申請</text>

  <!-- Columbus -->
  <line x1="1380" y1="422" x2="1380" y2="541" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1388" y="488" font-size="11" fill="#374151">API 呼叫</text>
  <rect x="1320" y="545" width="270" height="155" rx="12" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1336" y="569" font-size="13" font-weight="700" fill="#374151">Columbus 公司內部服務</text>
  <rect x="1335" y="582" width="115" height="104" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="1392" y="618" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Luna LLM</text>
  <text x="1392" y="640" text-anchor="middle" font-size="11" fill="#6B7280">AI Gateway</text>
  <text x="1392" y="657" text-anchor="middle" font-size="11" fill="#6B7280">經 APIM</text>
  <rect x="1462" y="582" width="115" height="104" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1519" y="612" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">LangSmith</text>
  <text x="1519" y="632" text-anchor="middle" font-size="11" fill="#6B7280">Tracing</text>
  <text x="1519" y="654" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">RD 開發用</text>
  <text x="1519" y="672" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">非 chatbot</text>

  <!-- ===== Branch strip ===== -->
  <text x="40" y="560" font-size="14" font-weight="700" fill="#111827">分支 → 環境</text>
  <g font-size="13" fill="#374151" text-anchor="middle">
    <rect x="40" y="575" width="290" height="44" rx="22" fill="#F3F4F6"/>
    <text x="185" y="602">feature → MR：Lint + Unit Test</text>
    <rect x="345" y="575" width="290" height="44" rx="22" fill="#ECFDF5"/>
    <text x="490" y="602">develop → DEV：自動部署</text>
    <rect x="650" y="575" width="350" height="44" rx="22" fill="#EFF6FF"/>
    <text x="825" y="602">tag → QAS / PRD：完整掃描 + 手動核准</text>
  </g>
</svg>
