<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1600" height="720" fill="#FFFFFF"/>

  <!-- ===== Developer ===== -->
  <circle cx="70" cy="122" r="18" fill="#374151"/>
  <path d="M40,178 Q40,146 70,146 Q100,146 100,178 Z" fill="#374151"/>
  <text x="70" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Developer</text>
  <text x="70" y="222" text-anchor="middle" font-size="11" fill="#6B7280">LangGraph Studio</text>
  <line x1="108" y1="150" x2="176" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="142" y="140" text-anchor="middle" font-size="12" fill="#374151">git push</text>

  <!-- App Repo -->
  <rect x="180" y="110" width="120" height="80" rx="10" fill="#FFF7F2" stroke="#FC6D26" stroke-width="2"/>
  <text x="240" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#E24329">App Repo</text>
  <text x="240" y="167" text-anchor="middle" font-size="11" fill="#6B7280">AIF-GitLab</text>
  <line x1="300" y1="150" x2="336" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== CI Phase ===== -->
  <rect x="340" y="60" width="470" height="170" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="575" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#15803D">CI/CD Pipeline</text>
  <text x="575" y="106" text-anchor="middle" font-size="12" fill="#15803D">(CI Phase)</text>
  <g font-size="13" font-weight="700" fill="#111827" text-anchor="middle">
    <rect x="360" y="125" width="130" height="52" rx="8" fill="#DCFCE7" stroke="#16A34A"/>
    <text x="425" y="156">Run Test</text>
    <rect x="510" y="125" width="130" height="52" rx="8" fill="#DCFCE7" stroke="#16A34A"/>
    <text x="575" y="156">LangGraph Build</text>
    <rect x="660" y="125" width="130" height="52" rx="8" fill="#DCFCE7" stroke="#16A34A"/>
    <text x="725" y="156">Docker Build</text>
  </g>
  <g stroke="#374151" stroke-width="2" marker-end="url(#arr)">
    <line x1="490" y1="151" x2="508" y2="151"/>
    <line x1="640" y1="151" x2="658" y2="151"/>
  </g>
  <text x="575" y="208" text-anchor="middle" font-size="12" fill="#6B7280">tag 發版時加跑：SonarQube · SCA · Cosign 簽章 · Container Scan</text>

  <!-- push image -->
  <line x1="810" y1="150" x2="886" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="848" y="140" text-anchor="middle" font-size="12" fill="#374151">push image</text>

  <!-- Container Registry -->
  <path d="M892,125 L892,175 A38,10 0 0 0 968,175 L968,125" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <ellipse cx="930" cy="125" rx="38" ry="10" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
  <text x="930" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Container</text>
  <text x="930" y="219" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Registry</text>

