  <circle cx="930" cy="395" r="40" fill="#FFF4EE" stroke="#EF7B4D" stroke-width="2"/>
  <text x="930" y="391" text-anchor="middle" font-size="15" font-weight="700" fill="#EF7B4D">Argo</text>
  <text x="930" y="409" text-anchor="middle" font-size="15" font-weight="700" fill="#EF7B4D">CD</text>
  <line x1="810" y1="395" x2="886" y2="395" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="848" y="385" text-anchor="middle" font-size="12" fill="#374151">偵測變更</text>
  <line x1="972" y1="395" x2="1036" y2="395" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1004" y="383" text-anchor="middle" font-size="12" fill="#374151">Helm Sync</text>

