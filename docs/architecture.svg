  <text x="1240" y="235" text-anchor="middle" font-size="12" fill="#9333EA">選型討論中</text>
  <line x1="1240" y1="248" x2="1240" y2="276" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="1080" y="280" width="140" height="72" rx="8" fill="#FFFFFF" stroke="#374151"/>
  <text x="1150" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">LangGraph</text>
  <text x="1150" y="330" text-anchor="middle" font-size="12" fill="#374151">Agent Deployment</text>
  <line x1="1220" y1="316" x2="1246" y2="316" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="1250" y="290" width="60" height="52" rx="8" fill="#FFFFFF" stroke="#326CE5"/>
  <text x="1280" y="321" text-anchor="middle" font-size="13" font-weight="700" fill="#326CE5">Pod</text>
  <line x1="1310" y1="316" x2="1328" y2="316" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="1332" y="280" width="72" height="72" rx="8" fill="#FFFFFF" stroke="#DC2626"/>
  <text x="1368" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">Redis</text>
  <text x="1368" y="330" text-anchor="middle" font-size="10" fill="#6B7280">StatefulSet</text>
  <text x="1240" y="395" text-anchor="middle" font-size="11" fill="#6B7280">image 由 Container Registry 拉取（imagePullSecrets）</text>

  <!-- End user -->
  <circle cx="1545" cy="219" r="32" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
  <g fill="#374151">
    <circle cx="1533" cy="211" r="6"/><path d="M1523,231 Q1523,220 1533,220 Q1543,220 1543,231 Z"/>
    <circle cx="1557" cy="211" r="6"/><path d="M1547,231 Q1547,220 1557,220 Q1567,220 1567,231 Z"/>
    <circle cx="1545" cy="206" r="7"/><path d="M1533,231 Q1533,215 1545,215 Q1557,215 1557,231 Z"/>
  </g>
  <text x="1545" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">End User</text>
  <text x="1545" y="288" text-anchor="middle" font-size="11" fill="#6B7280">財務使用者</text>
  <line x1="1511" y1="219" x2="1404" y2="219" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1462" y="209" text-anchor="middle" font-size="11" fill="#374151">Ingress</text>

